[project]
name = "asistente-core"
version = "0.1.0"
description = "Acceso controlado a un LLM para organizaciones"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asistente-server",
    "asistente-sdk",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "sdk-python"]

[tool.uv.sources]
asistente-server = { workspace = true }
asistente-sdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"
