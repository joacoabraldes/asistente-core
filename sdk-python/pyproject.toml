[project]
name = "asistente-sdk"
version = "0.1.0"
description = "SDK para consumir asistente-core"
# Mas permisivo que el server a proposito: lo instalan las apps cliente.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente_sdk"]
